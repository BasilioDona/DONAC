<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DONAC - Iniciar sessão</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="logo-anim" width="68" height="68" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#0b2a4a"/>
        <path class="logo-d" fill="#ffffff" fill-rule="evenodd" d="M140 120H264A136 136 0 0 1 264 392H140Z M180 160H264A96 96 0 0 1 264 352H180Z"/>
        <g fill="#7fb2e5">
          <rect class="shelf s1" x="208" y="203" width="104" height="14" rx="7"/>
          <rect class="shelf s2" x="208" y="249" width="104" height="14" rx="7"/>
          <rect class="shelf s3" x="208" y="295" width="104" height="14" rx="7"/>
        </g>
      </svg>
      <div class="name">DONAC</div>
      <div class="tag-line">Gestão de Armazém, Obras e Funcionários</div>
    </div>
    <div id="msg"></div>
    <form id="login-form" autocomplete="on">
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Palavra-passe</label>
        <div class="pw-wrap"><input id="password" type="password" autocomplete="current-password" required>
          <button class="pw-toggle" id="pw-toggle" type="button" aria-label="Mostrar palavra-passe" aria-pressed="false"></button></div></div>
      <button class="btn btn-primary btn-block" id="btn-login" type="submit">Entrar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>initLoginPage();</script>
<script>
(function () {
  var inp = document.getElementById('password'), btn = document.getElementById('pw-toggle');
  var EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  var ICON = function (extra) { return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + EYE + (extra || '') + '</svg>'; };
  function setShow(show) {
    var a = inp.selectionStart, b = inp.selectionEnd;
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = show ? ICON('<path d="M4 4l16 16"/>') : ICON();
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    btn.setAttribute('aria-label', show ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe');
    try { inp.setSelectionRange(a, b); } catch (e) {}
  }
  setShow(false);
  // não tira o foco do campo ao tocar no botão (o teclado fica aberto)
  btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  btn.addEventListener('touchstart', function (e) { e.preventDefault(); btn.click(); }, { passive: false });
  btn.addEventListener('click', function () { setShow(inp.type === 'password'); inp.focus(); });
  // por segurança, volta a ocultar se a app/página sair do ecrã
  document.addEventListener('visibilitychange', function () { if (document.hidden && inp.type === 'text') setShow(false); });
})();
</script>
</body>
</html>
