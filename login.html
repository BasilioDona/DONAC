<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DONAC - Iniciar sessão</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
        <rect width="52" height="52" rx="12" fill="#0b2a4a"/>
        <path d="M16 13h10c8 0 13 5 13 13s-5 13-13 13H16z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      <div class="name">DONAC</div>
      <div class="tag-line">Gestão de Armazém, Obras e Funcionários</div>
    </div>
    <div id="msg"></div>
    <form id="login-form" autocomplete="on">
      <div class="field"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Palavra-passe</label>
        <input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" id="btn-login" type="submit">Entrar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
